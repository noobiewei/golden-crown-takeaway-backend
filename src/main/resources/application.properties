spring.application.name=takeaway-backend

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GoldenCrownTakeaway;encrypt=true;trustServerCertificate=true
spring.datasource.username=takeaway_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
